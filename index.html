<!DOCTYPE html>
<html lang="kz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZE – Өмірді басқару өнері</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    .font-pixel { font-family: 'Press Start 2P', cursive; }
    .font-zen { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .pixel-box {
      box-shadow: 4px 4px 0px #000, -4px -4px 0px #fd4d96;
    }
    
    .pulse-glow {
      animation: pulseGlow 3s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
      100% { box-shadow: 0 0 30px rgba(56, 189, 248, 0.5); }
    }

    .pixel-glow {
      animation: pixelPulse 2s infinite alternate;
    }
    @keyframes pixelPulse {
      0% { filter: drop-shadow(0 0 5px #facc15); }
      100% { filter: drop-shadow(0 0 15px #facc15); }
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen selection:bg-sky-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://vbplbvledfttyoefdzim.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_j45QbUJePkf6cVHRyYqAZg_NzXnrLTF';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function App() {
      const [mode, setMode] = useState('zen');
      const [lang, setLang] = useState('kz');
      const [activeTab, setActiveTab] = useState('home');
      const [user, setUser] = useState(null);

      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [authMsg, setAuthMsg] = useState('');

      // AI Mentor State
      const [messages, setMessages] = useState([
        { sender: 'ai', text: 'Сәлем! Мен KAZE ЖИ Менторымын. Өміріңді, қаржыңды және жоспарларыңды басқаруға қалай көмектесемін?' }
      ]);
      const [inputMsg, setInputMsg] = useState('');
      const [loadingAi, setLoadingAi] = useState(false);
      const [isListening, setIsListening] = useState(false);

      const GEMINI_API_KEY = 'AQ.Ab8RN6IdBzPyYKFkIYaVhfFysRVD4Hw91HmRU-U37erClIyCTQ';
      const OPENAI_API_KEY = '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';

      const [tasks, setTasks] = useState([]);
      const [newTask, setNewTask] = useState('');

      const [transactions, setTransactions] = useState([]);
      const [finTitle, setFinTitle] = useState('');
      const [finAmount, setFinAmount] = useState('');

      const [dreams, setDreams] = useState([
        { id: 1, title: 'Жаңа ноутбук', targetAmount: 500000, currentAmount: 180000 }
      ]);

      const [pixelUser, setPixelUser] = useState({ level: 1, xp: 60 });
      const [capsules] = useState([
        { id: 1, title: '2027 жылғы маған хат', content: 'Сәлем, болашақтағы мен!', unlockDate: '2027-01-01', locked: true }
      ]);

      const [movies] = useState([
        { id: 1, title: 'Hunter x Hunter', genre: 'Аниме / Шытырман', rating: '9.4', episodes: '148 серия', desc: 'Гон мен Киллуаның сапары.' },
        { id: 2, title: 'Fight Club', genre: 'Драма / Психология', rating: '8.8', episodes: 'Толық метраж', desc: 'Ішкі еркіндік.' }
      ]);
      const [selectedMovie, setSelectedMovie] = useState(null);

      const t = {
        kz: { 
          title: "KAZE", sub: "Өмірді басқару өнері", zenBtn: "🌿 ZEN", pixelBtn: "🕹️ PIXEL", 
          finance: "Қаржы", planner: "Планер", dreams: "Армандар", pixelRoom: "Pixel Бөлме", capsule: "Болашаққа хат", cinema: "Кинозал & Аниме", mentor: "ЖИ Ментор", 
          back: "← Басты бетке", send: "Жіберу", voiceBtn: "🎤 Дауыспен", add: "Қосу", currency: "₸", logout: "Шығу" 
        },
        ru: { 
          title: "KAZE", sub: "Искусство управлять жизнью", zenBtn: "🌿 ZEN", pixelBtn: "🕹️ PIXEL", 
          finance: "Финансы", planner: "Планер", dreams: "Мечты", pixelRoom: "Pixel Комната", capsule: "Письмо в будущее", cinema: "Кинозал & Аниме", mentor: "ИИ Ментор", 
          back: "← На главную", send: "Отправить", voiceBtn: "🎤 Голос", add: "Добавить", currency: "₸", logout: "Выйти" 
        },
        en: { 
          title: "KAZE", sub: "The Art of Life Control", zenBtn: "🌿 ZEN", pixelBtn: "🕹️ PIXEL", 
          finance: "Finance", planner: "Planner", dreams: "Dreams", pixelRoom: "Pixel Room", capsule: "Time Capsule", cinema: "Cinema & Anime", mentor: "AI Mentor", 
          back: "← Home", send: "Send", voiceBtn: "🎤 Voice", add: "Add", currency: "$", logout: "Logout" 
        },
        uz: { 
          title: "KAZE", sub: "Hayotni boshqarish san'ati", zenBtn: "🌿 ZEN", pixelBtn: "🕹️ PIXEL", 
          finance: "Moliya", planner: "Reja", dreams: "Orzular", pixelRoom: "Pixel Xona", capsule: "Kapsula", cinema: "Kino & Anime", mentor: "AI Mentor", 
          back: "← Asosiy", send: "Yuborish", voiceBtn: "🎤 Ovoz", add: "Qo'shish", currency: "сўм", logout: "Chiqish" 
        },
        zh: { 
          title: "KAZE", sub: "生活管理的艺术", zenBtn: "🌿 ZEN", pixelBtn: "🕹️ PIXEL", 
          finance: "财务", planner: "计划", dreams: "梦想", pixelRoom: "像素房间", capsule: "时光胶囊", cinema: "影院与动漫", mentor: "AI 导师", 
          back: "← 首页", send: "发送", add: "添加", currency: "¥", logout: "登出" 
        }
      };

      const currText = t[lang] || t.kz;
      const isPixel = mode === 'pixel';

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthMsg('');
        if (isSignUp) {
          const { error } = await supabase.auth.signUp({ email, password });
          if (error) setAuthMsg(error.message);
          else setAuthMsg('Тіркелу сәтті өтті!');
        } else {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) setAuthMsg(error.message);
        }
      };

      const handleLogout = () => {
        supabase.auth.signOut();
      };

      const startVoiceInput = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('Бұл браузер дауыспен енгізуді қолдамайды.');
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = lang === 'kz' ? 'kk-KZ' : lang === 'ru' ? 'ru-RU' : lang === 'en' ? 'en-US' : lang === 'uz' ? 'uz-UZ' : 'zh-CN';
        recognition.onstart = () => setIsListening(true);
        recognition.onresult = (event) => {
          const speechToText = event.results[0][0].transcript;
          setInputMsg(speechToText);
          setIsListening(false);
        };
        recognition.onerror = () => setIsListening(false);
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      // Auto Ensemble AI: Gemini & ChatGPT API Fetchers
      const fetchGeminiResponse = async (promptText) => {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `Sen KAZE өмірді басқару жүйесінің ақылды ЖИ менторысың. Мына сұраққа нақты, терең әрі мотивациялық жауап бер (${lang} тілінде): ${promptText}` }] }]
            })
          });
          const data = await res.json();
          return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
        } catch {
          return null;
        }
      };

      const fetchOpenAIResponse = async (promptText) => {
        try {
          const res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${OPENAI_API_KEY}`
            },
            body: JSON.stringify({
              model: 'gpt-3.5-turbo',
              messages: [{ role: 'user', content: `Sen KAZE өмірді басқару жүйесінің ақылды ЖИ менторысың. Нақты, терең әрі мотивациялық жауап бер (${lang} тілінде): ${promptText}` }]
            })
          });
          const data = await res.json();
          return data.choices?.[0]?.message?.content || null;
        } catch {
          return null;
        }
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!inputMsg.trim() || loadingAi) return;

        const userText = inputMsg;
        setMessages(prev => [...prev, { sender: 'user', text: userText }]);
        setInputMsg('');
        setLoadingAi(true);

        try {
          // Both APIs are called simultaneously in parallel
          const [geminiResult, openaiResult] = await Promise.all([
            fetchGeminiResponse(userText),
            fetchOpenAIResponse(userText)
          ]);

          let bestResponse = "";

          // Auto-selection algorithm: Evaluate length, completeness, and availability
          if (geminiResult && openaiResult) {
            bestResponse = geminiResult.length >= openaiResult.length ? geminiResult : openaiResult;
          } else {
            bestResponse = geminiResult || openaiResult || `"${userText}" бойынша ЖИ Ментор сараптамасы: Мақсатыңызды айқындап, жүйелі әрекет жасаңыз!`;
          }

          setMessages(prev => [...prev, { sender: 'ai', text: bestResponse }]);
        } catch (err) {
          setMessages(prev => [...prev, { sender: 'ai', text: 'ЖИ Ментор байланысында қателік орын алды. Қайталап көріңіз.' }]);
        } finally {
          setLoadingAi(false);
        }
      };

      const handleAddFin = (e, type) => {
        e.preventDefault();
        if (!finTitle || !finAmount) return;
        setTransactions([{ id: Date.now(), title: finTitle, amount: Number(finAmount), type }, ...transactions]);
        setFinTitle('');
        setFinAmount('');
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTask.trim()) return;
        setTasks([{ id: Date.now(), text: newTask, done: false }, ...tasks]);
        setNewTask('');
        setPixelUser(prev => ({ ...prev, xp: prev.xp + 15 }));
      };

      const toggleTask = (id) => {
        setTasks(tasks.map(item => item.id === id ? { ...item, done: !item.done } : item));
      };

      return (
        <div class={`min-h-screen p-6 transition-all duration-700 ${isPixel ? 'bg-slate-950 font-pixel text-pink-300 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900 via-slate-950 to-black' : 'bg-slate-950 font-zen text-slate-100 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black'}`}>
          
          <header class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4 pb-6 border-b border-slate-800/80">
            <div class="cursor-pointer group" onClick={() => { setActiveTab('home'); setSelectedMovie(null); }}>
              <h1 class={`text-3xl font-black tracking-wider transition-all duration-300 ${isPixel ? 'text-yellow-400 pixel-glow' : 'text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-indigo-300 to-purple-400'}`}>
                {currText.title}
              </h1>
              <p class="text-xs opacity-75 mt-1 font-semibold">{currText.sub}</p>
            </div>

            <div class="flex items-center gap-3">
              <select 
                value={lang} 
                onChange={(e) => setLang(e.target.value)}
                class="bg-slate-900/90 text-white border border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none cursor-pointer"
              >
                <option value="kz">🇰🇿 Қазақша</option>
                <option value="ru">🇷🇺 Русский</option>
                <option value="en">🇬🇧 English</option>
                <option value="uz">🇺🇿 O'zbekcha</option>
                <option value="zh">🇨🇳 中文</option>
              </select>

              {user && (
                <button onClick={handleLogout} class="bg-rose-600/80 hover:bg-rose-500 text-white px-3 py-2 rounded-xl text-xs font-bold cursor-pointer">
                  {currText.logout}
                </button>
              )}

              <button 
                onClick={() => setMode(isPixel ? 'zen' : 'pixel')}
                class={`px-4 py-2 rounded-xl font-bold text-xs transition-all duration-300 shadow-xl cursor-pointer ${isPixel ? 'bg-yellow-400 text-black hover:bg-yellow-300 pixel-box' : 'bg-gradient-to-r from-sky-500 to-indigo-600 text-white hover:from-sky-400 hover:to-indigo-500 pulse-glow'}`}
              >
                {isPixel ? currText.zenBtn : currText.pixelBtn}
              </button>
            </div>
          </header>

          <main class="max-w-6xl mx-auto mt-6 fade-in">
            {!user ? (
              <div class={`max-w-md mx-auto p-8 rounded-3xl border shadow-2xl mt-12 backdrop-blur-xl ${isPixel ? 'bg-purple-950/40 border-pink-500/50 pixel-box' : 'bg-slate-900/60 border-slate-800 pulse-glow'}`}>
                <h2 class="text-2xl font-black mb-6 text-center">{isSignUp ? 'Тіркелу' : 'Кіру'}</h2>
                {authMsg && <div class="mb-4 text-xs p-3 bg-amber-500/10 border border-amber-500/50 text-amber-300 rounded-xl">{authMsg}</div>}
                <form onSubmit={handleAuth} class="space-y-4">
                  <div>
                    <label class="text-xs font-semibold text-slate-400">Email</label>
                    <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm mt-1 focus:outline-none focus:border-sky-500" />
                  </div>
                  <div>
                    <label class="text-xs font-semibold text-slate-400">Құпиясөз</label>
                    <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm mt-1 focus:outline-none focus:border-sky-500" />
                  </div>
                  <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-bold py-3.5 rounded-xl text-sm cursor-pointer shadow-lg">
                    {isSignUp ? 'Тіркелу' : 'Кіру'}
                  </button>
                </form>
                <div class="text-center mt-5">
                  <button onClick={() => setIsSignUp(!isSignUp)} class="text-xs text-sky-400 underline cursor-pointer">
                    {isSignUp ? 'Аккаунт бар ма? Кіру' : 'Аккаунт жоқ па? Тіркелу'}
                  </button>
                </div>
              </div>
            ) : (
              <div>
                {activeTab !== 'home' && (
                  <div class="mb-6">
                    <button onClick={() => { setActiveTab('home'); setSelectedMovie(null); }} class="text-xs font-bold px-4 py-2.5 bg-slate-900/80 border border-slate-700 hover:bg-slate-800 rounded-xl cursor-pointer">
                      {currText.back}
                    </button>
                  </div>
                )}

                {activeTab === 'home' && (
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                    <div onClick={() => setActiveTab('finance')} class="p-6 bg-slate-900/60 rounded-2xl border border-slate-800 cursor-pointer hover:scale-[1.03] transition-all">
                      <div class="text-4xl mb-3">💰</div>
                      <h3 class="font-bold text-lg mb-1">{currText.finance}</h3>
                      <p class="text-xs text-slate-400">Бұлттық қаржы.</p>
                    </div>
                    <div onClick={() => setActiveTab('planner')} class="p-6 bg-slate-900/60 rounded-2xl border border-slate-800 cursor-pointer hover:scale-[1.03] transition-all">
                      <div class="text-4xl mb-3">📅</div>
                      <h3 class="font-bold text-lg mb-1">{currText.planner}</h3>
                      <p class="text-xs text-slate-400">Мақсаттар тізімі.</p>
                    </div>
                    <div onClick={() => setActiveTab('dreams')} class="p-6 bg-slate-900/60 rounded-2xl border border-slate-800 cursor-pointer hover:scale-[1.03] transition-all">
                      <div class="text-4xl mb-3">🎯</div>
                      <h3 class="font-bold text-lg mb-1">{currText.dreams}</h3>
                      <p class="text-xs text-slate-400">Smart-копилка.</p>
                    </div>
                    <div onClick={() => setActiveTab('pixelroom')} class="p-6 bg-slate-900/60 rounded-2xl border border-slate-800 cursor-pointer hover:scale-[1.03] transition-all">
                      <div class="text-4xl mb-3">🕹️</div>
                      <h3 class="font-bold text-lg mb-1">{currText.pixelRoom}</h3>
                      <p class="text-xs text-slate-400">RPG персонаж.</p>
                    </div>
                    <div onClick={() => setActiveTab('capsule')} class="p-6 bg-slate-900/60 rounded-2xl border border-slate-800 cursor-pointer hover:scale-[1.03] transition-all">
                      <div class="text-4xl mb-3">✉️</div>
                      <h3 class="font-bold text-lg mb-1">{currText.capsule}</h3>
                      <p class="text-xs text-slate-400">Уақыт капсуласы.</p>
                    </div>
                    <div onClick={() => setActiveTab('cinema')} class="p-6 bg-slate-900/60 rounded-2xl border border-slate-800 cursor-pointer hover:scale-[1.03] transition-all">
                      <div class="text-4xl mb-3">🎬</div>
                      <h3 class="font-bold text-lg mb-1">{currText.cinema}</h3>
                      <p class="text-xs text-slate-400">Watch Party.</p>
                    </div>
                    <div onClick={() => setActiveTab('mentor')} class="p-6 bg-slate-900/60 rounded-2xl border border-slate-800 cursor-pointer hover:scale-[1.03] transition-all md:col-span-2">
                      <div class="text-4xl mb-3">🤖</div>
                      <h3 class="font-bold text-lg mb-1">{currText.mentor}</h3>
                      <p class="text-xs text-slate-400">Ақылды ЖИ Ментор.</p>
                    </div>
                  </div>
                )}

                {activeTab === 'mentor' && (
                  <div class="p-6 bg-slate-900/70 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-2xl">
                    <h2 class="text-2xl font-black mb-4 flex items-center gap-2">🤖 {currText.mentor}</h2>
                    <div class="h-80 overflow-y-auto space-y-3 mb-4 p-4 rounded-2xl bg-slate-950/80 border border-slate-800">
                      {messages.map((m, idx) => (
                        <div key={idx} class={`p-3.5 rounded-2xl max-w-xl text-sm leading-relaxed ${m.sender === 'user' ? 'ml-auto bg-gradient-to-r from-sky-500 to-indigo-600 text-white shadow-md' : 'bg-slate-800/90 text-slate-200 border border-slate-700'}`}>
                          {m.text}
                        </div>
                      ))}
                      {loadingAi && <div class="text-xs text-sky-400 italic font-semibold">ЖИ Ментор сұраққа ең сапалы жауап іздеп жатыр...</div>}
                      {isListening && <div class="text-xs text-rose-400 animate-pulse font-bold">🔴 Микрофон қосулы, сөйлеңіз...</div>}
                    </div>
                    <form onSubmit={handleSendMessage} class="flex gap-2">
                      <button type="button" onClick={startVoiceInput} class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-3 rounded-xl text-sm cursor-pointer shadow-md transition-all">
                        🎤
                      </button>
                      <input 
                        type="text" 
                        value={inputMsg}
                        onChange={(e) => setInputMsg(e.target.value)}
                        placeholder="Сұрағыңызды жазыңыз немесе дауыспен айтыңыз..."
                        class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500"
                      />
                      <button type="submit" disabled={loadingAi} class="bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 font-bold px-6 py-3 rounded-xl text-sm cursor-pointer shadow-md">
                        {currText.send}
                      </button>
                    </form>
                  </div>
                )}

                {activeTab === 'planner' && (
                  <div class="p-6 bg-slate-900/70 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-2xl">
                    <h2 class="text-2xl font-black mb-4">📅 {currText.planner}</h2>
                    <form onSubmit={handleAddTask} class="flex gap-2 mb-4">
                      <input type="text" value={newTask} onChange={(e) => setNewTask(e.target.value)} placeholder="Жаңа мақсат..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm" />
                      <button type="submit" class="bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl text-sm cursor-pointer">{currText.add}</button>
                    </form>
                    <div class="space-y-2">
                      {tasks.map(item => (
                        <div key={item.id} onClick={() => toggleTask(item.id)} class={`p-4 rounded-xl border cursor-pointer flex justify-between items-center ${item.done ? 'bg-slate-950/40 border-slate-900 line-through opacity-50' : 'bg-slate-950/80 border-slate-800'}`}>
                          <span class="text-sm">{item.text}</span>
                          <span>{item.done ? '✅' : '⏳'}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'finance' && (
                  <div class="p-6 bg-slate-900/70 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-2xl">
                    <h2 class="text-2xl font-black mb-4">💰 {currText.finance}</h2>
                    <div class="flex flex-wrap gap-2 mb-4">
                      <input type="text" placeholder="Атауы..." value={finTitle} onChange={(e) => setFinTitle(e.target.value)} class="flex-1 min-w-[200px] bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm" />
                      <input type="number" placeholder={currText.currency} value={finAmount} onChange={(e) => setFinAmount(e.target.value)} class="w-36 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm" />
                      <button onClick={(e) => handleAddFin(e, 'income')} class="bg-emerald-500 text-white font-bold px-4 py-3 rounded-xl text-sm cursor-pointer">+ Кіріс</button>
                      <button onClick={(e) => handleAddFin(e, 'expense')} class="bg-rose-500 text-white font-bold px-4 py-3 rounded-xl text-sm cursor-pointer">- Шығыс</button>
                    </div>
                    <div class="space-y-2">
                      {transactions.map(item => (
                        <div key={item.id} class="p-4 bg-slate-950/70 rounded-xl border border-slate-800 flex justify-between text-sm">
                          <span>{item.title}</span>
                          <span class={item.type === 'income' ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>{item.type === 'income' ? '+' : '-'}{item.amount} {currText.currency}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'pixelroom' && (
                  <div class="p-8 bg-slate-900/70 backdrop-blur-xl rounded-3xl border border-slate-800 text-center">
                    <h2 class="text-2xl font-black mb-6">🕹️ {currText.pixelRoom}</h2>
                    <div class="inline-block p-8 bg-slate-950 rounded-2xl border border-slate-800 mb-6">
                      <div class="text-7xl mb-4 pixel-glow">🧙‍♂️</div>
                      <p class="text-yellow-400 font-bold text-lg">Level {pixelUser.level}</p>
                      <p class="text-xs text-slate-400 mt-1">XP: {pixelUser.xp} / 100</p>
                    </div>
                  </div>
                )}

                {activeTab === 'dreams' && (
                  <div class="p-6 bg-slate-900/70 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-2xl">
                    <h2 class="text-2xl font-black mb-4">🎯 {currText.dreams}</h2>
                  </div>
                )}

                {activeTab === 'capsule' && (
                  <div class="p-6 bg-slate-900/70 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-2xl">
                    <h2 class="text-2xl font-black mb-4">✉️ {currText.capsule}</h2>
                  </div>
                )}

                {activeTab === 'cinema' && (
                  <div class="p-6 bg-slate-900/70 backdrop-blur-xl rounded-3xl border border-slate-800 shadow-2xl">
                    <h2 class="text-2xl font-black mb-4">🎬 {currText.cinema}</h2>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
