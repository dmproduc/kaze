<!DOCTYPE html>
<html lang="kz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZE – Өмірді басқару өнері</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .font-pixel { font-family: 'Press Start 2P', cursive; }
    .font-zen { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://vbplbvledfttyoefdzim.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_j45QbUJePkf6cVHRyYqAZg_NzXnrLTF';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function App() {
      const [mode, setMode] = useState('zen');
      const [lang, setLang] = useState('kz');
      const [activeTab, setActiveTab] = useState('home');
      const [user, setUser] = useState(null);

      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [authMsg, setAuthMsg] = useState('');

      const [messages, setMessages] = useState([
        { sender: 'ai', text: 'Сәлем! Мен KAZE ЖИ Менторымын. Өміріңді, қаржыңды және жоспарларыңды басқаруға қалай көмектесемін?' }
      ]);
      const [inputMsg, setInputMsg] = useState('');
      const [loadingAi, setLoadingAi] = useState(false);

      const [tasks, setTasks] = useState([]);
      const [newTask, setNewTask] = useState('');

      const [transactions, setTransactions] = useState([]);
      const [finTitle, setFinTitle] = useState('');
      const [finAmount, setFinAmount] = useState('');

      const [pixelUser, setPixelUser] = useState({ level: 1, xp: 40 });

      const [capsules] = useState([
        { id: 1, title: '2027 жылғы маған хат', content: 'Сәлем, болашақтағы мен!', unlockDate: '2027-01-01', locked: true }
      ]);

      // Movies & Anime (Кинозал) State
      const [movies, setMovies] = useState([
        { id: 1, title: 'Hunter x Hunter', genre: 'Аниме / Шытырман', rating: '9.4', desc: 'Гон мен Киллуаның әлемдік шытырман сапары.' },
        { id: 2, title: 'Fight Club', genre: 'Драма / Психология', rating: '8.8', desc: 'Ішкі еркіндік пен сананы ояту.' },
        { id: 3, title: 'Cyberpunk: Edgerunners', genre: 'Аниме / Экшен', rating: '9.1', desc: 'Найт-Сити көшелеріндегі атыс пен мақсат.' },
        { id: 4, title: 'Interstellar', genre: 'Ғылыми / Фантастика', rating: '9.3', desc: 'Уақыт пен кеңістік арқылы сапар.' }
      ]);
      const [selectedMovie, setSelectedMovie] = useState(null);

      const t = {
        kz: { 
          title: "KAZE", sub: "Өмірді басқару өнері", zenBtn: "🌿 ZEN Режимі", pixelBtn: "🕹️ PIXEL Режимі", 
          finance: "Қаржы", planner: "Планер", dreams: "Армандар", pixelRoom: "Pixel Бөлме", capsule: "Болашаққа хат", cinema: "Кинозал & Аниме", mentor: "ЖИ Ментор", 
          back: "← Басты бетке", send: "Жіберу", add: "Қосу", currency: "₸", logout: "Шығу" 
        },
        ru: { 
          title: "KAZE", sub: "Искусство управлять жизнью", zenBtn: "🌿 ZEN Режим", pixelBtn: "🕹️ PIXEL Режим", 
          finance: "Финансы", planner: "Планер", dreams: "Мечты", pixelRoom: "Pixel Комната", capsule: "Письмо в будущее", cinema: "Кинозал & Аниме", mentor: "ИИ Ментор", 
          back: "← На главную", send: "Отправить", add: "Добавить", currency: "₸", logout: "Выйти" 
        },
        en: { 
          title: "KAZE", sub: "The Art of Life Control", zenBtn: "🌿 ZEN Mode", pixelBtn: "🕹️ PIXEL Mode", 
          finance: "Finance", planner: "Planner", dreams: "Dreams", pixelRoom: "Pixel Room", capsule: "Time Capsule", cinema: "Cinema & Anime", mentor: "AI Mentor", 
          back: "← Home", send: "Send", add: "Add", currency: "$", logout: "Logout" 
        },
        uz: { 
          title: "KAZE", sub: "Hayotni boshqarish san'ati", zenBtn: "🌿 ZEN Rejimi", pixelBtn: "🕹️ PIXEL Rejimi", 
          finance: "Moliya", planner: "Reja", dreams: "Orzular", pixelRoom: "Pixel Xona", capsule: "Kapsula", cinema: "Kino & Anime", mentor: "AI Mentor", 
          back: "← Asosiy", send: "Yuborish", add: "Qo'shish", currency: "сўм", logout: "Chiqish" 
        },
        zh: { 
          title: "KAZE", sub: "生活管理的艺术", zenBtn: "🌿 ZEN 模式", pixelBtn: "🕹️ PIXEL 模式", 
          finance: "财务", planner: "计划", dreams: "梦想", pixelRoom: "像素房间", capsule: "时光胶囊", cinema: "影院与动漫", mentor: "AI 导师", 
          back: "← 首页", send: "发送", add: "添加", currency: "¥", logout: "登出" 
        }
      };

      const currText = t[lang] || t.kz;
      const isPixel = mode === 'pixel';

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthMsg('');
        if (isSignUp) {
          const { error } = await supabase.auth.signUp({ email, password });
          if (error) setAuthMsg(error.message);
          else setAuthMsg('Тіркелу сәтті өтті!');
        } else {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) setAuthMsg(error.message);
        }
      };

      const handleLogout = () => {
        supabase.auth.signOut();
      };

      const handleAddFin = (e, type) => {
        e.preventDefault();
        if (!finTitle || !finAmount) return;
        setTransactions([{ id: Date.now(), title: finTitle, amount: Number(finAmount), type }, ...transactions]);
        setFinTitle('');
        setFinAmount('');
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTask.trim()) return;
        setTasks([{ id: Date.now(), text: newTask, done: false }, ...tasks]);
        setNewTask('');
      };

      const toggleTask = (id) => {
        setTasks(tasks.map(item => item.id === id ? { ...item, done: !item.done } : item));
      };

      return (
        <div class={`min-h-screen p-6 transition-colors duration-500 ${isPixel ? 'bg-purple-950 font-pixel text-pink-300' : 'bg-slate-900 font-zen text-slate-100'}`}>
          <header class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4 pb-6 border-b border-slate-700/50">
            <div class="cursor-pointer" onClick={() => { setActiveTab('home'); setSelectedMovie(null); }}>
              <h1 class={`text-3xl font-bold tracking-wider ${isPixel ? 'text-yellow-400 drop-shadow-[0_2px_0_#000]' : 'text-sky-400'}`}>
                {currText.title}
              </h1>
              <p class="text-sm opacity-75 mt-1">{currText.sub}</p>
            </div>

            <div class="flex items-center gap-3">
              <select 
                value={lang} 
                onChange={(e) => setLang(e.target.value)}
                class="bg-slate-800 text-white border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none cursor-pointer"
              >
                <option value="kz">🇰🇿 Қазақша</option>
                <option value="ru">🇷🇺 Русский</option>
                <option value="en">🇬🇧 English</option>
                <option value="uz">🇺🇿 O'zbekcha</option>
                <option value="zh">🇨🇳 中文</option>
              </select>

              {user && (
                <button onClick={handleLogout} class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-2 rounded-lg text-xs font-bold cursor-pointer">
                  {currText.logout}
                </button>
              )}

              <button 
                onClick={() => setMode(isPixel ? 'zen' : 'pixel')}
                class={`px-4 py-2 rounded-lg font-bold text-sm transition-all shadow-lg cursor-pointer ${isPixel ? 'bg-yellow-400 text-black hover:bg-yellow-300' : 'bg-sky-500 text-white hover:bg-sky-400'}`}
              >
                {isPixel ? currText.zenBtn : currText.pixelBtn}
              </button>
            </div>
          </header>

          <main class="max-w-6xl mx-auto mt-6">
            {!user ? (
              <div class="max-w-md mx-auto p-6 bg-slate-800 rounded-2xl border border-slate-700 shadow-xl mt-12">
                <h2 class="text-xl font-bold mb-4 text-center">{isSignUp ? 'Тіркелу' : 'Кіру'}</h2>
                {authMsg && <div class="mb-4 text-xs p-3 bg-slate-900 border border-amber-500 text-amber-300 rounded-lg">{authMsg}</div>}
                <form onSubmit={handleAuth} class="space-y-4">
                  <div>
                    <label class="text-xs opacity-75">Email</label>
                    <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm mt-1 focus:outline-none" />
                  </div>
                  <div>
                    <label class="text-xs opacity-75">Құпиясөз</label>
                    <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm mt-1 focus:outline-none" />
                  </div>
                  <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 rounded-xl text-sm cursor-pointer">
                    {isSignUp ? 'Тіркелу' : 'Кіру'}
                  </button>
                </form>
                <div class="text-center mt-4">
                  <button onClick={() => setIsSignUp(!isSignUp)} class="text-xs text-sky-400 underline cursor-pointer">
                    {isSignUp ? 'Аккаунт бар ма? Кіру' : 'Аккаунт жоқ па? Тіркелу'}
                  </button>
                </div>
              </div>
            ) : (
              <div>
                {activeTab !== 'home' && (
                  <div class="mb-4">
                    <button onClick={() => { setActiveTab('home'); setSelectedMovie(null); }} class="text-sm px-4 py-2 bg-slate-800 rounded-lg border border-slate-700 hover:bg-slate-700 cursor-pointer">
                      {currText.back}
                    </button>
                  </div>
                )}

                {activeTab === 'home' && (
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-4">
                    <div onClick={() => setActiveTab('finance')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">💰</div>
                      <h3 class="font-bold text-sm mb-1">{currText.finance}</h3>
                    </div>
                    <div onClick={() => setActiveTab('planner')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">📅</div>
                      <h3 class="font-bold text-sm mb-1">{currText.planner}</h3>
                    </div>
                    <div onClick={() => setActiveTab('dreams')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">🎯</div>
                      <h3 class="font-bold text-sm mb-1">{currText.dreams}</h3>
                    </div>
                    <div onClick={() => setActiveTab('pixelroom')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">🕹️</div>
                      <h3 class="font-bold text-sm mb-1">{currText.pixelRoom}</h3>
                    </div>
                    <div onClick={() => setActiveTab('capsule')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">✉️</div>
                      <h3 class="font-bold text-sm mb-1">{currText.capsule}</h3>
                    </div>
                    <div onClick={() => setActiveTab('cinema')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">🎬</div>
                      <h3 class="font-bold text-sm mb-1">{currText.cinema}</h3>
                    </div>
                    <div onClick={() => setActiveTab('mentor')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">🤖</div>
                      <h3 class="font-bold text-sm mb-1">{currText.mentor}</h3>
                    </div>
                  </div>
                )}

                {activeTab === 'cinema' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700">
                    <h2 class="text-2xl font-bold mb-4">🎬 {currText.cinema}</h2>
                    {selectedMovie ? (
                      <div class="p-6 bg-slate-900 rounded-xl border border-slate-700">
                        <button onClick={() => setSelectedMovie(null)} class="text-xs text-sky-400 mb-4 underline cursor-pointer">← Каталогқа оралу</button>
                        <h3 class="text-2xl font-bold mb-2">{selectedMovie.title}</h3>
                        <p class="text-xs text-amber-400 mb-2">⭐ {selectedMovie.rating} | {selectedMovie.genre}</p>
                        <p class="text-sm opacity-80 mb-6">{selectedMovie.desc}</p>
                        <div class="p-8 bg-slate-950 rounded-xl text-center border border-slate-800">
                          <span class="text-4xl">🍿</span>
                          <p class="text-sm mt-2 text-sky-400 font-bold">Watch Party сеансы қосылды!</p>
                          <p class="text-xs opacity-60 mt-1">Достарыңызды шақырып, бірге көріңіз.</p>
                        </div>
                      </div>
                    ) : (
                      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        {movies.map(m => (
                          <div key={m.id} onClick={() => setSelectedMovie(m)} class="p-4 bg-slate-900 rounded-xl border border-slate-800 cursor-pointer hover:border-sky-500 transition-all">
                            <div class="h-32 bg-slate-800 rounded-lg mb-3 flex items-center justify-center text-3xl">🍿</div>
                            <h3 class="font-bold text-sm mb-1">{m.title}</h3>
                            <p class="text-xs opacity-75 mb-2">{m.genre}</p>
                            <span class="text-xs bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded font-bold">⭐ {m.rating}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {activeTab === 'finance' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700">
                    <h2 class="text-2xl font-bold mb-4">💰 {currText.finance}</h2>
                    <div class="flex flex-wrap gap-2 mb-4">
                      <input type="text" placeholder="..." value={finTitle} onChange={(e) => setFinTitle(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                      <input type="number" placeholder={currText.currency} value={finAmount} onChange={(e) => setFinAmount(e.target.value)} class="w-36 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                      <button onClick={(e) => handleAddFin(e, 'income')} class="bg-emerald-500 text-white font-bold px-4 py-3 rounded-xl text-sm cursor-pointer">+ Кіріс</button>
                      <button onClick={(e) => handleAddFin(e, 'expense')} class="bg-rose-500 text-white font-bold px-4 py-3 rounded-xl text-sm cursor-pointer">- Шығыс</button>
                    </div>
                    <div class="space-y-2">
                      {transactions.map(item => (
                        <div key={item.id} class="p-4 bg-slate-900/60 rounded-xl border border-slate-800 flex justify-between text-sm">
                          <span>{item.title}</span>
                          <span class={item.type === 'income' ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>{item.type === 'income' ? '+' : '-'}{item.amount} {currText.currency}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'planner' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700">
                    <h2 class="text-2xl font-bold mb-4">📅 {currText.planner}</h2>
                    <form onSubmit={handleAddTask} class="flex gap-2 mb-4">
                      <input type="text" value={newTask} onChange={(e) => setNewTask(e.target.value)} placeholder="..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                      <button type="submit" class="bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl text-sm cursor-pointer">{currText.add}</button>
                    </form>
                    <div class="space-y-2">
                      {tasks.map(item => (
                        <div key={item.id} onClick={() => toggleTask(item.id)} class={`p-4 rounded-xl border cursor-pointer flex justify-between ${item.done ? 'bg-slate-900/40 border-slate-800 line-through opacity-50' : 'bg-slate-900/80 border-slate-700'}`}>
                          <span>{item.text}</span>
                          <span>{item.done ? '✅' : '⏳'}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'pixelroom' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700 text-center">
                    <h2 class="text-2xl font-bold mb-4">🕹️ {currText.pixelRoom}</h2>
                    <div class="text-6xl mb-3">🧙‍♂️</div>
                    <p class="text-yellow-400 font-bold">Level: {pixelUser.level} (XP: {pixelUser.xp})</p>
                  </div>
                )}

                {activeTab === 'dreams' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700">
                    <h2 class="text-2xl font-bold mb-4">🎯 {currText.dreams}</h2>
                  </div>
                )}

                {activeTab === 'capsule' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700">
                    <h2 class="text-2xl font-bold mb-4">✉️ {currText.capsule}</h2>
                  </div>
                )}

                {activeTab === 'mentor' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700">
                    <h2 class="text-2xl font-bold mb-4">🤖 {currText.mentor}</h2>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
