<!DOCTYPE html>
<html lang="kz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZE – Өмірді басқару өнері</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .font-pixel { font-family: 'Press Start 2P', cursive; }
    .font-zen { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://vbplbvledfttyoefdzim.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_j45QbUJePkf6cVHRyYqAZg_NzXnrLTF';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function App() {
      const [mode, setMode] = useState('zen');
      const [lang, setLang] = useState('kz');
      const [activeTab, setActiveTab] = useState('home');
      const [user, setUser] = useState(null);

      // Auth state
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [authMsg, setAuthMsg] = useState('');

      const [messages, setMessages] = useState([
        { sender: 'ai', text: 'Сәлем! Мен KAZE ЖИ Менторымын. Өміріңді, қаржыңды және жоспарларыңды басқаруға қалай көмектесемін?' }
      ]);
      const [inputMsg, setInputMsg] = useState('');
      const [loadingAi, setLoadingAi] = useState(false);

      const [tasks, setTasks] = useState([]);
      const [newTask, setNewTask] = useState('');

      const [transactions, setTransactions] = useState([]);
      const [finTitle, setFinTitle] = useState('');
      const [finAmount, setFinAmount] = useState('');

      const [dreams, setDreams] = useState([
        { id: 1, title: 'Жаңа ноутбук', targetAmount: 500000, currentAmount: 150000 }
      ]);
      const [dreamTitle, setDreamTitle] = useState('');
      const [dreamTarget, setDreamTarget] = useState('');

      const [pixelUser, setPixelUser] = useState({ level: 1, xp: 40 });

      const [movies] = useState([
        { id: 1, title: 'Hunter x Hunter', genre: 'Аниме / Шытырман', rating: '9.4' },
        { id: 2, title: 'Fight Club', genre: 'Драма / Психология', rating: '8.8' },
        { id: 3, title: 'Cyberpunk: Edgerunners', genre: 'Аниме / Экшен', rating: '9.1' }
      ]);

      const t = {
        kz: { title: "KAZE", sub: "Өмірді басқару өнері", zenBtn: "🌿 ZEN Режимі", pixelBtn: "🕹️ PIXEL Режимі", finance: "Қаржы", planner: "Планер", dreams: "Армандар", pixelRoom: "Pixel Бөлме", cinema: "Кинозал & Аниме", mentor: "ЖИ Ментор", back: "← Басты бетке", send: "Жіберу", add: "Қосу" }
      };

      const isPixel = mode === 'pixel';

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthMsg('');
        if (isSignUp) {
          const { error } = await supabase.auth.signUp({ email, password });
          if (error) setAuthMsg(error.message);
          else setAuthMsg('Тіркелу сәтті өтті! Поштаңызды тексеріңіз немесе кіріңіз.');
        } else {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) setAuthMsg(error.message);
        }
      };

      const handleLogout = () => {
        supabase.auth.signOut();
      };

      const handleAddFin = async (e, type) => {
        e.preventDefault();
        if (!finTitle || !finAmount) return;
        setTransactions([{ id: Date.now(), title: finTitle, amount: Number(finAmount), type }, ...transactions]);
        setFinTitle('');
        setFinAmount('');
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTask.trim()) return;
        setTasks([{ id: Date.now(), text: newTask, done: false }, ...tasks]);
        setNewTask('');
      };

      const toggleTask = (id) => {
        setTasks(tasks.map(item => item.id === id ? { ...item, done: !item.done } : item));
      };

      return (
        <div class={`min-h-screen p-6 transition-colors duration-500 ${isPixel ? 'bg-purple-950 font-pixel text-pink-300' : 'bg-slate-900 font-zen text-slate-100'}`}>
          <header class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4 pb-6 border-b border-slate-700/50">
            <div class="cursor-pointer" onClick={() => setActiveTab('home')}>
              <h1 class={`text-3xl font-bold tracking-wider ${isPixel ? 'text-yellow-400 drop-shadow-[0_2px_0_#000]' : 'text-sky-400'}`}>
                {t.kz.title}
              </h1>
              <p class="text-sm opacity-75 mt-1">{t.kz.sub}</p>
            </div>

            <div class="flex items-center gap-3">
              {user && (
                <button 
                  onClick={handleLogout}
                  class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-2 rounded-lg text-xs font-bold cursor-pointer"
                >
                  Шығу ({user.email.split('@')[0]})
                </button>
              )}
              <button 
                onClick={() => setMode(isPixel ? 'zen' : 'pixel')}
                class={`px-4 py-2 rounded-lg font-bold text-sm transition-all shadow-lg cursor-pointer ${isPixel ? 'bg-yellow-400 text-black hover:bg-yellow-300' : 'bg-sky-500 text-white hover:bg-sky-400'}`}
              >
                {isPixel ? t.kz.zenBtn : t.kz.pixelBtn}
              </button>
            </div>
          </header>

          <main class="max-w-6xl mx-auto mt-6">
            {!user ? (
              <div class="max-w-md mx-auto p-6 bg-slate-800 rounded-2xl border border-slate-700 shadow-xl mt-12">
                <h2 class="text-xl font-bold mb-4 text-center">{isSignUp ? 'KAZE-ге Тіркелу' : 'KAZE-ге Кіру'}</h2>
                {authMsg && <div class="mb-4 text-xs p-3 bg-slate-900 border border-amber-500 text-amber-300 rounded-lg">{authMsg}</div>}
                <form onSubmit={handleAuth} class="space-y-4">
                  <div>
                    <label class="text-xs opacity-75">Email</label>
                    <input 
                      type="email" 
                      required 
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm mt-1 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label class="text-xs opacity-75">Құпиясөз</label>
                    <input 
                      type="password" 
                      required 
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm mt-1 focus:outline-none"
                    />
                  </div>
                  <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 rounded-xl text-sm cursor-pointer">
                    {isSignUp ? 'Тіркелу' : 'Кіру'}
                  </button>
                </form>
                <div class="text-center mt-4">
                  <button 
                    onClick={() => setIsSignUp(!isSignUp)}
                    class="text-xs text-sky-400 underline cursor-pointer"
                  >
                    {isSignUp ? 'Аккаунтыңыз бар ма? Кіріңіз' : 'Аккаунт жоқ па? Тіркеліңіз'}
                  </button>
                </div>
              </div>
            ) : (
              <div>
                {activeTab !== 'home' && (
                  <div class="mb-4">
                    <button 
                      onClick={() => setActiveTab('home')}
                      class="text-sm px-4 py-2 bg-slate-800 rounded-lg border border-slate-700 hover:bg-slate-700 cursor-pointer"
                    >
                      {t.kz.back}
                    </button>
                  </div>
                )}

                {activeTab === 'home' && (
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4">
                    <div onClick={() => setActiveTab('finance')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">💰</div>
                      <h3 class="font-bold text-base mb-1">Қаржы</h3>
                      <p class="text-xs opacity-75">Бюджет бақылауы.</p>
                    </div>

                    <div onClick={() => setActiveTab('planner')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">📅</div>
                      <h3 class="font-bold text-base mb-1">Планер</h3>
                      <p class="text-xs opacity-75">Мақсаттар тізімі.</p>
                    </div>

                    <div onClick={() => setActiveTab('dreams')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">🎯</div>
                      <h3 class="font-bold text-base mb-1">Армандар</h3>
                      <p class="text-xs opacity-75">Smart-копилка.</p>
                    </div>

                    <div onClick={() => setActiveTab('pixelroom')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">🕹️</div>
                      <h3 class="font-bold text-base mb-1">Pixel Бөлме</h3>
                      <p class="text-xs opacity-75">RPG персонаж.</p>
                    </div>

                    <div onClick={() => setActiveTab('cinema')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">🎬</div>
                      <h3 class="font-bold text-base mb-1">Кинозал</h3>
                      <p class="text-xs opacity-75">Аниме & Фильмдер.</p>
                    </div>

                    <div onClick={() => setActiveTab('mentor')} class="p-5 bg-slate-800/80 rounded-2xl border border-slate-700 cursor-pointer hover:scale-105 transition-all">
                      <div class="text-3xl mb-3">🤖</div>
                      <h3 class="font-bold text-base mb-1">ЖИ Ментор</h3>
                      <p class="text-xs opacity-75">Ақылды кеңесші.</p>
                    </div>
                  </div>
                )}

                {activeTab === 'finance' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700">
                    <h2 class="text-2xl font-bold mb-4">💰 Қаржы</h2>
                    <div class="flex flex-wrap gap-2 mb-4">
                      <input type="text" placeholder="Атауы..." value={finTitle} onChange={(e) => setFinTitle(e.target.value)} class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                      <input type="number" placeholder="Сома (₸)" value={finAmount} onChange={(e) => setFinAmount(e.target.value)} class="w-36 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                      <button onClick={(e) => handleAddFin(e, 'income')} class="bg-emerald-500 text-white font-bold px-4 py-3 rounded-xl text-sm cursor-pointer">+ Кіріс</button>
                      <button onClick={(e) => handleAddFin(e, 'expense')} class="bg-rose-500 text-white font-bold px-4 py-3 rounded-xl text-sm cursor-pointer">- Шығыс</button>
                    </div>
                    <div class="space-y-2">
                      {transactions.map(item => (
                        <div key={item.id} class="p-4 bg-slate-900/60 rounded-xl border border-slate-800 flex justify-between text-sm">
                          <span>{item.title}</span>
                          <span class={item.type === 'income' ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>{item.type === 'income' ? '+' : '-'}{item.amount} ₸</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'planner' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700">
                    <h2 class="text-2xl font-bold mb-4">📅 Планер</h2>
                    <form onSubmit={handleAddTask} class="flex gap-2 mb-4">
                      <input type="text" value={newTask} onChange={(e) => setNewTask(e.target.value)} placeholder="Жаңа мақсат..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                      <button type="submit" class="bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl text-sm cursor-pointer">Қосу</button>
                    </form>
                    <div class="space-y-2">
                      {tasks.map(item => (
                        <div key={item.id} onClick={() => toggleTask(item.id)} class={`p-4 rounded-xl border cursor-pointer flex justify-between ${item.done ? 'bg-slate-900/40 border-slate-800 line-through opacity-50' : 'bg-slate-900/80 border-slate-700'}`}>
                          <span>{item.text}</span>
                          <span>{item.done ? '✅' : '⏳'}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'pixelroom' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700 text-center">
                    <h2 class="text-2xl font-bold mb-4">🕹️ Pixel Бөлме</h2>
                    <div class="text-6xl mb-3">🧙‍♂️</div>
                    <p class="text-yellow-400 font-bold">Деңгей: {pixelUser.level} (XP: {pixelUser.xp})</p>
                  </div>
                )}

                {activeTab === 'dreams' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700">
                    <h2 class="text-2xl font-bold mb-4">🎯 Армандар тақтасы</h2>
                    <p class="text-sm opacity-75">Мақсаттар мен копилка жүйесі белсенді.</p>
                  </div>
                )}

                {activeTab === 'cinema' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700">
                    <h2 class="text-2xl font-bold mb-4">🎬 Кинозал & Аниме</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {movies.map(m => (
                        <div key={m.id} class="p-4 bg-slate-900 rounded-xl border border-slate-800">
                          <h3 class="font-bold text-sm mb-1">{m.title}</h3>
                          <p class="text-xs opacity-75">{m.genre}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'mentor' && (
                  <div class="p-6 bg-slate-800 rounded-2xl border border-slate-700">
                    <h2 class="text-2xl font-bold mb-4">🤖 ЖИ Ментор</h2>
                    <p class="text-sm opacity-75">Ақылды көмекші жүйеде.</p>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
