<!DOCTYPE html>
<html lang="kz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAZE – Өмірді басқару өнері</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .font-pixel { font-family: 'Press Start 2P', cursive; }
    .font-zen { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://vbplbvledfttyoefdzim.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_j45QbUJePkf6cVHRyYqAZg_NzXnrLTF';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function App() {
      const [mode, setMode] = useState('zen');
      const [lang, setLang] = useState('kz');
      const [activeTab, setActiveTab] = useState('home');

      const [messages, setMessages] = useState([
        { sender: 'ai', text: 'Сәлем! Мен KAZE ЖИ Менторымын. Өміріңді, қаржыңды және жоспарларыңды басқаруға қалай көмектесемін?' }
      ]);
      const [inputMsg, setInputMsg] = useState('');
      const [loadingAi, setLoadingAi] = useState(false);

      const [tasks, setTasks] = useState([]);
      const [newTask, setNewTask] = useState('');

      const [transactions, setTransactions] = useState([]);
      const [finTitle, setFinTitle] = useState('');
      const [finAmount, setFinAmount] = useState('');

      // Dreams (Smart-Копилка) State
      const [dreams, setDreams] = useState([
        { id: 1, title: 'Жаңа ноутбук', targetAmount: 500000, currentAmount: 150000 }
      ]);
      const [dreamTitle, setDreamTitle] = useState('');
      const [dreamTarget, setDreamTarget] = useState('');

      const [movies] = useState([
        { id: 1, title: 'Hunter x Hunter', genre: 'Аниме / Шытырман', rating: '9.4' },
        { id: 2, title: 'Fight Club', genre: 'Драма / Психология', rating: '8.8' },
        { id: 3, title: 'Cyberpunk: Edgerunners', genre: 'Аниме / Экшен', rating: '9.1' }
      ]);

      const t = {
        kz: { title: "KAZE", sub: "Өмірді басқару өнері", zenBtn: "🌿 ZEN Режимі", pixelBtn: "🕹️ PIXEL Режимі", finance: "Қаржы", planner: "Планер", dreams: "Армандар тақтасы", cinema: "Кинозал & Аниме", mentor: "ЖИ Ментор", back: "← Басты бетке", send: "Жіберу", add: "Қосу" },
        ru: { title: "KAZE", sub: "Искусство управлять жизнью", zenBtn: "🌿 ZEN Режим", pixelBtn: "🕹️ PIXEL Режим", finance: "Финансы", planner: "Планер", dreams: "Доска мечты", cinema: "Кинозал & Аниме", mentor: "ИИ Ментор", back: "← На главную", send: "Отправить", add: "Добавить" },
        en: { title: "KAZE", sub: "The Art of Life Control", zenBtn: "🌿 ZEN Mode", pixelBtn: "🕹️ PIXEL Mode", finance: "Finance", planner: "Planner", dreams: "Dream Board", cinema: "Cinema & Anime", mentor: "AI Mentor", back: "← Home", send: "Send", add: "Add" },
        uz: { title: "KAZE", sub: "Hayotni boshqarish san'ati", zenBtn: "🌿 ZEN Rejimi", pixelBtn: "🕹️ PIXEL Rejimi", finance: "Moliya", planner: "Reja", dreams: "Orzular taxtasi", cinema: "Kino & Anime", mentor: "AI Mentor", back: "← Asosiy", send: "Yuborish", add: "Qo'shish" },
        zh: { title: "KAZE", sub: "生活管理的艺术", zenBtn: "🌿 ZEN 模式", pixelBtn: "🕹️ PIXEL 模式", finance: "财务", planner: "计划", dreams: "梦想板", cinema: "影院与动漫", mentor: "AI 导师", back: "← 首页", send: "发送", add: "添加" }
      };

      const isPixel = mode === 'pixel';

      useEffect(() => {
        fetchTransactions();
        fetchTasks();
      }, []);

      const fetchTransactions = async () => {
        const { data, error } = await supabase.from('transactions').select('*').order('id', { ascending: false });
        if (data && !error) setTransactions(data);
      };

      const fetchTasks = async () => {
        const { data, error } = await supabase.from('tasks').select('*').order('id', { ascending: false });
        if (data && !error) {
          setTasks(data);
        } else {
          setTasks([
            { id: 1, text: 'KAZE жүйесін реттеу', done: true },
            { id: 2, text: 'Supabase бұлттық базасын қосу', done: true }
          ]);
        }
      };

      const handleAddFin = async (e, type) => {
        e.preventDefault();
        if (!finTitle || !finAmount) return;

        const newTx = { title: finTitle, amount: Number(finAmount), type };
        const { data, error } = await supabase.from('transactions').insert([newTx]).select();
        
        if (data && !error) {
          setTransactions([data[0], ...transactions]);
          setFinTitle('');
          setFinAmount('');
        } else {
          setTransactions([{ id: Date.now(), ...newTx }, ...transactions]);
          setFinTitle('');
          setFinAmount('');
        }
      };

      const handleAddTask = async (e) => {
        e.preventDefault();
        if (!newTask.trim()) return;

        const item = { text: newTask, done: false };
        const { data, error } = await supabase.from('tasks').insert([item]).select();

        if (data && !error) {
          setTasks([data[0], ...tasks]);
          setNewTask('');
        } else {
          setTasks([{ id: Date.now(), ...item }, ...tasks]);
          setNewTask('');
        }
      };

      const toggleTask = async (id, doneState) => {
        const newDone = !doneState;
        setTasks(tasks.map(item => item.id === id ? { ...item, done: newDone } : item));
        await supabase.from('tasks').update({ done: newDone }).eq('id', id);
      };

      const handleAddDream = (e) => {
        e.preventDefault();
        if (!dreamTitle || !dreamTarget) return;
        setDreams([...dreams, { id: Date.now(), title: dreamTitle, targetAmount: Number(dreamTarget), currentAmount: 0 }]);
        setDreamTitle('');
        setDreamTarget('');
      };

      const addMoneyToDream = (id, amount) => {
        setDreams(dreams.map(d => d.id === id ? { ...d, currentAmount: d.currentAmount + amount } : d));
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputMsg.trim() || loadingAi) return;
        
        const userText = inputMsg;
        setMessages(prev => [...prev, { sender: 'user', text: userText }]);
        setInputMsg('');
        setLoadingAi(true);

        setTimeout(() => {
          let reply = `"${userText}" мақсатыңа жету үшін Адамдар тақтасына арманыңды енгізіп, жинай бастаймыз!`;
          setMessages(prev => [...prev, { sender: 'ai', text: reply }]);
          setLoadingAi(false);
        }, 500);
      };

      return (
        <div class={`min-h-screen p-6 transition-colors duration-500 ${isPixel ? 'bg-purple-950 font-pixel text-pink-300' : 'bg-slate-900 font-zen text-slate-100'}`}>
          <header class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4 pb-6 border-b border-slate-700/50">
            <div class="cursor-pointer" onClick={() => setActiveTab('home')}>
              <h1 class={`text-3xl font-bold tracking-wider ${isPixel ? 'text-yellow-400 drop-shadow-[0_2px_0_#000]' : 'text-sky-400'}`}>
                {t[lang].title}
              </h1>
              <p class="text-sm opacity-75 mt-1">{t[lang].sub}</p>
            </div>

            <div class="flex items-center gap-3">
              <select 
                value={lang} 
                onChange={(e) => setLang(e.target.value)}
                class="bg-slate-800 text-white border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none cursor-pointer"
              >
                <option value="kz">🇰🇿 Қазақша</option>
                <option value="ru">🇷🇺 Русский</option>
                <option value="en">🇬🇧 English</option>
                <option value="uz">🇺🇿 O'zbekcha</option>
                <option value="zh">🇨🇳 中文</option>
              </select>

              <button 
                onClick={() => setMode(isPixel ? 'zen' : 'pixel')}
                class={`px-4 py-2 rounded-lg font-bold text-sm transition-all shadow-lg cursor-pointer ${isPixel ? 'bg-yellow-400 text-black hover:bg-yellow-300' : 'bg-sky-500 text-white hover:bg-sky-400'}`}
              >
                {isPixel ? t[lang].zenBtn : t[lang].pixelBtn}
              </button>
            </div>
          </header>

          {activeTab !== 'home' && (
            <div class="max-w-6xl mx-auto mt-4">
              <button 
                onClick={() => setActiveTab('home')}
                class="text-sm px-4 py-2 bg-slate-800 rounded-lg border border-slate-700 hover:bg-slate-700 cursor-pointer"
              >
                {t[lang].back}
              </button>
            </div>
          )}

          <main class="max-w-6xl mx-auto mt-6">
            {activeTab === 'home' && (
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <div onClick={() => setActiveTab('finance')} class={`p-5 rounded-2xl border cursor-pointer hover:scale-105 transition-all shadow-md ${isPixel ? 'bg-purple-900/60 border-pink-500' : 'bg-slate-800/80 border-slate-700'}`}>
                  <div class="text-3xl mb-3">💰</div>
                  <h3 class="font-bold text-lg mb-1">{t[lang].finance}</h3>
                  <p class="text-xs opacity-75">Supabase бұлттық қаржысы.</p>
                </div>

                <div onClick={() => setActiveTab('planner')} class={`p-5 rounded-2xl border cursor-pointer hover:scale-105 transition-all shadow-md ${isPixel ? 'bg-purple-900/60 border-pink-500' : 'bg-slate-800/80 border-slate-700'}`}>
                  <div class="text-3xl mb-3">📅</div>
                  <h3 class="font-bold text-lg mb-1">{t[lang].planner}</h3>
                  <p class="text-xs opacity-75">Супер-планер жүйесі.</p>
                </div>

                <div onClick={() => setActiveTab('dreams')} class={`p-5 rounded-2xl border cursor-pointer hover:scale-105 transition-all shadow-md ${isPixel ? 'bg-purple-900/60 border-pink-500' : 'bg-slate-800/80 border-slate-700'}`}>
                  <div class="text-3xl mb-3">🎯</div>
                  <h3 class="font-bold text-lg mb-1">{t[lang].dreams}</h3>
                  <p class="text-xs opacity-75">Smart-копилка & мақсаттар.</p>
                </div>

                <div onClick={() => setActiveTab('cinema')} class={`p-5 rounded-2xl border cursor-pointer hover:scale-105 transition-all shadow-md ${isPixel ? 'bg-purple-900/60 border-pink-500' : 'bg-slate-800/80 border-slate-700'}`}>
                  <div class="text-3xl mb-3">🎬</div>
                  <h3 class="font-bold text-lg mb-1">{t[lang].cinema}</h3>
                  <p class="text-xs opacity-75">Аниме & Кинозал.</p>
                </div>

                <div onClick={() => setActiveTab('mentor')} class={`p-5 rounded-2xl border cursor-pointer hover:scale-105 transition-all shadow-md ${isPixel ? 'bg-purple-900/60 border-pink-500' : 'bg-slate-800/80 border-slate-700'}`}>
                  <div class="text-3xl mb-3">🤖</div>
                  <h3 class="font-bold text-lg mb-1">{t[lang].mentor}</h3>
                  <p class="text-xs opacity-75">ЖИ Ақылды Ментор.</p>
                </div>
              </div>
            )}

            {/* DREAMS TAB */}
            {activeTab === 'dreams' && (
              <div class={`p-6 rounded-2xl border ${isPixel ? 'bg-purple-900/60 border-pink-500' : 'bg-slate-800 border-slate-700'}`}>
                <h2 class="text-2xl font-bold mb-4">🎯 {t[lang].dreams}</h2>
                <form onSubmit={handleAddDream} class="flex flex-wrap gap-2 mb-6">
                  <input 
                    type="text" 
                    placeholder="Арманның атауы (мысалы: Телевизор)" 
                    value={dreamTitle}
                    onChange={(e) => setDreamTitle(e.target.value)}
                    class="flex-1 min-w-[200px] bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm"
                  />
                  <input 
                    type="number" 
                    placeholder="Бағасы (₸)" 
                    value={dreamTarget}
                    onChange={(e) => setDreamTarget(e.target.value)}
                    class="w-40 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm"
                  />
                  <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-6 py-3 rounded-xl text-sm cursor-pointer">
                    + Арман қосу
                  </button>
                </form>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {dreams.map(item => {
                    const percent = Math.min(100, Math.round((item.currentAmount / item.targetAmount) * 100));
                    return (
                      <div key={item.id} class="p-5 bg-slate-900/80 rounded-xl border border-slate-700">
                        <div class="flex justify-between items-center mb-2">
                          <h3 class="font-bold text-base">{item.title}</h3>
                          <span class="text-xs bg-amber-500/20 text-amber-400 font-bold px-2 py-1 rounded">{percent}%</span>
                        </div>
                        <div class="w-full bg-slate-800 rounded-full h-3 mb-3 overflow-hidden">
                          <div class="bg-amber-400 h-3 rounded-full transition-all duration-500" style={{ width: `${percent}%` }}></div>
                        </div>
                        <div class="flex justify-between items-center text-xs opacity-80 mb-3">
                          <span>Жиналғаны: {item.currentAmount.toLocaleString()} ₸</span>
                          <span>Мақсат: {item.targetAmount.toLocaleString()} ₸</span>
                        </div>
                        <button 
                          onClick={() => addMoneyToDream(item.id, 5000)}
                          class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-600 font-bold py-2 rounded-lg text-xs cursor-pointer"
                        >
                          + 5,000 ₸ Сұғу (Копилка)
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'mentor' && (
              <div class={`p-6 rounded-2xl border ${isPixel ? 'bg-purple-900/60 border-pink-500' : 'bg-slate-800 border-slate-700'}`}>
                <h2 class="text-2xl font-bold mb-4">🤖 {t[lang].mentor}</h2>
                <div class="h-80 overflow-y-auto space-y-3 mb-4 p-4 rounded-xl bg-slate-950/60 border border-slate-800">
                  {messages.map((m, idx) => (
                    <div key={idx} class={`p-3 rounded-xl max-w-xl text-sm ${m.sender === 'user' ? 'ml-auto bg-sky-600 text-white' : 'bg-slate-700 text-slate-200'}`}>
                      {m.text}
                    </div>
                  ))}
                  {loadingAi && <div class="text-xs text-sky-400 italic">ЖИ ойланып жатыр...</div>}
                </div>
                <form onSubmit={handleSendMessage} class="flex gap-2">
                  <input 
                    type="text" 
                    value={inputMsg}
                    onChange={(e) => setInputMsg(e.target.value)}
                    placeholder="Сұрағыңызды жазыңыз..."
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none"
                  />
                  <button type="submit" disabled={loadingAi} class="bg-sky-500 hover:bg-sky-400 disabled:opacity-50 text-white font-bold px-6 py-3 rounded-xl text-sm cursor-pointer">
                    {t[lang].send}
                  </button>
                </form>
              </div>
            )}

            {activeTab === 'planner' && (
              <div class={`p-6 rounded-2xl border ${isPixel ? 'bg-purple-900/60 border-pink-500' : 'bg-slate-800 border-slate-700'}`}>
                <h2 class="text-2xl font-bold mb-4">📅 {t[lang].planner}</h2>
                <form onSubmit={handleAddTask} class="flex gap-2 mb-4">
                  <input 
                    type="text" 
                    value={newTask}
                    onChange={(e) => setNewTask(e.target.value)}
                    placeholder="Жаңа мақсат енгізіңіз..."
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none"
                  />
                  <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-white font-bold px-6 py-3 rounded-xl text-sm cursor-pointer">
                    {t[lang].add}
                  </button>
                </form>
                <div class="space-y-2">
                  {tasks.map(item => (
                    <div key={item.id} onClick={() => toggleTask(item.id, item.done)} class={`p-4 rounded-xl border cursor-pointer flex justify-between items-center transition-all ${item.done ? 'bg-slate-900/40 border-slate-800 line-through opacity-50' : 'bg-slate-900/80 border-slate-700'}`}>
                      <span class="text-sm">{item.text}</span>
                      <span>{item.done ? '✅' : '⏳'}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'finance' && (
              <div class={`p-6 rounded-2xl border ${isPixel ? 'bg-purple-900/60 border-pink-500' : 'bg-slate-800 border-slate-700'}`}>
                <h2 class="text-2xl font-bold mb-4">💰 {t[lang].finance}</h2>
                <div class="flex flex-wrap gap-2 mb-4">
                  <input 
                    type="text" 
                    placeholder="Атауы..." 
                    value={finTitle}
                    onChange={(e) => setFinTitle(e.target.value)}
                    class="flex-1 min-w-[200px] bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm"
                  />
                  <input 
                    type="number" 
                    placeholder="Сома (₸)" 
                    value={finAmount}
                    onChange={(e) => setFinAmount(e.target.value)}
                    class="w-36 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm"
                  />
                  <button onClick={(e) => handleAddFin(e, 'income')} class="bg-emerald-500 hover:bg-emerald-400 text-white font-bold px-4 py-3 rounded-xl text-sm cursor-pointer">+ Кіріс</button>
                  <button onClick={(e) => handleAddFin(e, 'expense')} class="bg-rose-500 hover:bg-rose-400 text-white font-bold px-4 py-3 rounded-xl text-sm cursor-pointer">- Шығыс</button>
                </div>
                <div class="space-y-2">
                  {transactions.map(item => (
                    <div key={item.id} class="p-4 bg-slate-900/60 rounded-xl border border-slate-800 flex justify-between items-center text-sm">
                      <span>{item.title}</span>
                      <span class={item.type === 'income' ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>
                        {item.type === 'income' ? '+' : '-'}{item.amount} ₸
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'cinema' && (
              <div class={`p-6 rounded-2xl border ${isPixel ? 'bg-purple-900/60 border-pink-500' : 'bg-slate-800 border-slate-700'}`}>
                <h2 class="text-2xl font-bold mb-4">🎬 {t[lang].cinema}</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {movies.map(m => (
                    <div key={m.id} class="p-4 bg-slate-900 rounded-xl border border-slate-800">
                      <div class="h-32 bg-slate-800 rounded-lg mb-3 flex items-center justify-center text-3xl">🍿</div>
                      <h3 class="font-bold text-sm mb-1">{m.title}</h3>
                      <p class="text-xs opacity-75 mb-2">{m.genre}</p>
                      <span class="text-xs bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded font-bold">⭐ {m.rating}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
